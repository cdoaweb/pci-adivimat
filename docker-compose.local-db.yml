# Base de datos en local, para desarrollar sin depender de Atlas.
#
# Se encadena con docker-compose.yml. El .env lo hace por ti mediante
# COMPOSE_FILE; para pasarte a Atlas, quita este archivo de esa variable y
# apunta MONGO_URI a tu cluster.
#
# Uso explicito, si prefieres no tocar el .env:
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d

services:
  mongo:
    # Fijada a la mayor de la serie 8, que es la que instalaba el `mongo` sin
    # etiqueta del compose original. Sin fijar, un `docker compose pull` podria
    # traer una version mayor incompatible con los datos existentes.
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      # Sin volumen los datos se perderian con cada `docker compose down`.
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet --eval "db.adminCommand({ ping: 1 })"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    depends_on:
      mongo:
        # Espera a que Mongo acepte conexiones, no solo a que el contenedor
        # arranque, para que el backend no muera intentando conectar.
        condition: service_healthy

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # 8082 por defecto: el 8081 suele estar ocupado por otros proyectos.
      - '${MONGO_EXPRESS_PORT}:8081'
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/

volumes:
  mongo-data:
