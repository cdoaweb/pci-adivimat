server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # La aplicacion enruta en el cliente: cualquier ruta desconocida debe
  # devolver index.html en vez de un 404, o recargar /gestion romperia.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre, asi que pueden cachearse indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
