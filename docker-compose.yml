name: adivimat

# Servicios de la aplicacion. La base de datos NO esta aqui: el destino lo fija
# MONGO_URI, que puede apuntar a MongoDB Atlas o a un Mongo local.
#
# Para levantar tambien un Mongo en local, se encadena docker-compose.local-db.yml.
# El .env trae `COMPOSE_FILE` preparado para eso, asi que `docker compose up -d`
# funciona en los dos casos sin escribir mas banderas: para usar Atlas basta con
# dejar solo este archivo en esa variable.

services:
  backend:
    build:
      # El contexto es la raiz porque el backend depende del workspace shared/.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_CODE: ${ADMIN_CODE}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - '${PORT}:${PORT}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:''+process.env.PORT+''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/adivimat-accesible/Dockerfile
      args:
        # El navegador del usuario llama al backend por el puerto publicado en
        # el host, no por el nombre de servicio interno de docker.
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
